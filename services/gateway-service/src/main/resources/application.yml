spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: false
    sentinel:
      eager: false
    gateway:
      server:
        webflux:
          routes:
            - id: local-home-feed-api
              uri: ${STREAMORA_VIDEO_SERVICE_URL:http://127.0.0.1:8084}
              predicates:
                - Path=/api/v1/home/feed
            - id: local-playback-api
              uri: ${STREAMORA_PLAYBACK_SERVICE_URL:http://127.0.0.1:8087}
              predicates:
                - Path=/api/v1/videos/*/playback
            - id: local-video-api
              uri: ${STREAMORA_VIDEO_SERVICE_URL:http://127.0.0.1:8084}
              predicates:
                - Path=/api/v1/videos/**

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  registry:
    address: N/A
  protocol:
    name: tri
    port: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: foundation
