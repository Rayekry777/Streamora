spring:
  application:
    name: media-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:streamora_media;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    schemas: media
    default-schema: media
    create-schemas: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: false
    sentinel:
      eager: false

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  registry:
    address: N/A
  protocol:
    name: tri
    port: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: media-upload

streamora:
  identity:
    rpc-enabled: ${STREAMORA_IDENTITY_RPC_ENABLED:false}
  media:
    object-store:
      mode: ${STREAMORA_MEDIA_OBJECT_STORE_MODE:memory}
    upload:
      part-size-bytes: ${STREAMORA_MEDIA_PART_SIZE_BYTES:8388608}
      url-ttl-seconds: ${STREAMORA_MEDIA_URL_TTL_SECONDS:900}
