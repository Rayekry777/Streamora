spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:streamora_identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    schemas: identity
    default-schema: identity
    create-schemas: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: false
    sentinel:
      eager: false

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    # HTTP 与 Dubbo 共用应用名时仅注册接口地址，避免网关把 HTTP 流量负载到 Triple 端口。
    register-mode: interface
  registry:
    address: N/A
  protocol:
    name: tri
    port: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: foundation

streamora:
  session:
    secure-cookie: ${STREAMORA_SECURE_COOKIE:true}
    user-duration: ${STREAMORA_USER_SESSION_DURATION:PT8H}
    admin-duration: ${STREAMORA_ADMIN_SESSION_DURATION:PT2H}
  bootstrap:
    admin-login: ${STREAMORA_BOOTSTRAP_ADMIN_LOGIN:}
    admin-password: ${STREAMORA_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-display-name: ${STREAMORA_BOOTSTRAP_ADMIN_DISPLAY_NAME:Bootstrap Administrator}

---
spring:
  config:
    activate:
      on-profile: local

streamora:
  session:
    secure-cookie: false
