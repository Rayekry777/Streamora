spring:
  application:
    name: transcode-worker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        enabled: false
    sentinel:
      eager: false

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
  registry:
    address: N/A
  protocol:
    name: tri
    port: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: transcode

streamora:
  media:
    rpc-enabled: ${STREAMORA_MEDIA_RPC_ENABLED:false}
  transcode:
    worker-id: ${STREAMORA_TRANSCODE_WORKER_ID:transcode-worker-local}
    poll-delay-ms: ${STREAMORA_TRANSCODE_POLL_DELAY_MS:2000}
    ffmpeg-path: ${STREAMORA_TRANSCODE_FFMPEG_PATH:ffmpeg}
    local-input-root: ${STREAMORA_TRANSCODE_LOCAL_INPUT_ROOT:./runtime/media-input}
    local-output-root: ${STREAMORA_TRANSCODE_LOCAL_OUTPUT_ROOT:./runtime/media-output}
    work-root: ${STREAMORA_TRANSCODE_WORK_ROOT:./runtime/transcode-work}
