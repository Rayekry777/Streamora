name: ${STREAMORA_COMPOSE_PROJECT:-streamora}

x-infra-profiles: &infra-profiles
  - infra
  - core
  - full

x-core-profiles: &core-profiles
  - core
  - full

x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: compose
  NACOS_SERVER_ADDR: nacos:8848
  NACOS_DISCOVERY_ENABLED: "true"
  SENTINEL_DASHBOARD: sentinel:8858
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  # 封闭演示通过回环 HTTP 访问；TLS 入口部署时应在本地 .env 覆盖为 true。
  STREAMORA_SECURE_COOKIE: ${STREAMORA_SECURE_COOKIE:-false}

x-backend-base: &backend-base
  build:
    context: ../..
    dockerfile: platform/docker/backend.Dockerfile
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
  networks:
    - streamora-app
    - streamora-data
  depends_on:
    nacos:
      condition: service_healthy
    postgres-privileges-init:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    profiles: *infra-profiles
    restart: unless-stopped
    environment:
      POSTGRES_DB: streamora
      POSTGRES_USER: streamora_platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      STREAMORA_SERVICE_DB_PASSWORD: ${STREAMORA_SERVICE_DB_PASSWORD:?请在 .env 中设置 STREAMORA_SERVICE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamora_platform_admin -d streamora"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - streamora-data

  # 兼容已初始化的数据卷：为各服务历史 Flyway 迁移所需的数据库级权限做幂等同步。
  postgres-privileges-init:
    image: pgvector/pgvector:0.8.1-pg16
    profiles: *infra-profiles
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    command: ["sh", "-c", "psql -h postgres -U streamora_platform_admin -d streamora -v ON_ERROR_STOP=1 -c 'GRANT CONNECT, CREATE ON DATABASE streamora TO streamora_identity, streamora_admin, streamora_pet, streamora_video, streamora_media, streamora_playback'"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - streamora-data

  redis:
    image: redis:7.4.5-alpine
    profiles: *infra-profiles
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - streamora-data

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    profiles: *infra-profiles
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 .env 中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - streamora-app
      - streamora-data

  nacos:
    image: nacos/nacos-server:v3.0.3
    profiles: *infra-profiles
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3 镜像即使关闭鉴权也要求提供合法的签名和节点身份材料；生产环境在本机 .env 覆盖。
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-U3RyZWFtb3JhQ2xvc2VkRGVtb05hY29zVG9rZW5Gb3JMb2NhbE9ubHkyMDI2}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-streamora-core}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-closed-demo}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
    expose:
      - "9848"
      - "9849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - streamora-app

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    profiles: *infra-profiles
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    expose:
      - "9876"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - streamora-app

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    profiles: *infra-profiles
    restart: unless-stopped
    # 当前服务使用 RocketMQ 原生客户端；Proxy 作为独立组件按需启用。
    command: ["sh", "-c", "mkdir -p /home/rocketmq/logs/rocketmqlogs && exec sh mqbroker -n rocketmq-namesrv:9876"]
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
    expose:
      - "10909"
      - "10911"
      - "10912"
    depends_on:
      rocketmq-volume-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - streamora-app

  # Docker 新建命名卷归 root 所有；仅此一次性任务以 root 修正 RocketMQ 数据卷所有权，Broker 仍以镜像内非 root 用户运行。
  rocketmq-volume-init:
    image: apache/rocketmq:5.3.1
    profiles: *infra-profiles
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
    restart: "no"

  sentinel:
    image: bladex/sentinel-dashboard:1.8.8
    profiles: *infra-profiles
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858
    expose:
      - "8858"
    networks:
      - streamora-app

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: *infra-profiles
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - streamora-app

  loki:
    image: grafana/loki:3.5.3
    profiles: *infra-profiles
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - streamora-app

  tempo:
    image: grafana/tempo:2.8.2
    profiles: *infra-profiles
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    networks:
      - streamora-app

  grafana:
    image: grafana/grafana:12.1.0
    profiles: *infra-profiles
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?请在 .env 中设置 GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - streamora-app

  gateway-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/gateway-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args:
        SERVICE: gateway-service
    environment:
      <<: *backend-environment
      SERVER_PORT: "8080"
    expose: ["8080"]

  admin-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/admin-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: admin-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamora?currentSchema=admin
      SPRING_DATASOURCE_USERNAME: streamora_admin
      SPRING_DATASOURCE_PASSWORD: ${STREAMORA_SERVICE_DB_PASSWORD:?请在 .env 中设置 STREAMORA_SERVICE_DB_PASSWORD}
      STREAMORA_IDENTITY_RPC_ENABLED: "true"
      STREAMORA_BOOTSTRAP_ADMIN_SUBJECT_ID: ${STREAMORA_BOOTSTRAP_ADMIN_SUBJECT_ID:-1}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    expose: ["8081"]

  identity-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/identity-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: identity-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamora?currentSchema=identity
      SPRING_DATASOURCE_USERNAME: streamora_identity
      SPRING_DATASOURCE_PASSWORD: ${STREAMORA_SERVICE_DB_PASSWORD:?请在 .env 中设置 STREAMORA_SERVICE_DB_PASSWORD}
      STREAMORA_BOOTSTRAP_ADMIN_LOGIN: ${STREAMORA_BOOTSTRAP_ADMIN_LOGIN:-streamora-admin}
      STREAMORA_BOOTSTRAP_ADMIN_PASSWORD: ${STREAMORA_BOOTSTRAP_ADMIN_PASSWORD:?请在 .env 中设置 STREAMORA_BOOTSTRAP_ADMIN_PASSWORD}
      STREAMORA_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${STREAMORA_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Streamora Administrator}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose: ["8082"]

  user-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/user-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: user-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8083"
    expose: ["8083"]

  video-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/video-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: video-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamora?currentSchema=video
      SPRING_DATASOURCE_USERNAME: streamora_video
      SPRING_DATASOURCE_PASSWORD: ${STREAMORA_SERVICE_DB_PASSWORD:?请在 .env 中设置 STREAMORA_SERVICE_DB_PASSWORD}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose: ["8084"]

  media-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/media-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: media-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamora?currentSchema=media
      SPRING_DATASOURCE_USERNAME: streamora_media
      SPRING_DATASOURCE_PASSWORD: ${STREAMORA_SERVICE_DB_PASSWORD:?请在 .env 中设置 STREAMORA_SERVICE_DB_PASSWORD}
    expose: ["8085"]

  transcode-worker:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/transcode-worker:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: transcode-worker }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8086"
    expose: ["8086"]

  playback-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/playback-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: playback-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamora?currentSchema=playback
      SPRING_DATASOURCE_USERNAME: streamora_playback
      SPRING_DATASOURCE_PASSWORD: ${STREAMORA_SERVICE_DB_PASSWORD:?请在 .env 中设置 STREAMORA_SERVICE_DB_PASSWORD}
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose: ["8087"]

  danmaku-service:
    <<: *backend-base
    profiles: ["full"]
    image: streamora/danmaku-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: danmaku-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8088"
    expose: ["8088"]

  comment-service:
    <<: *backend-base
    profiles: ["full"]
    image: streamora/comment-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: comment-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8089"
    expose: ["8089"]

  engagement-service:
    <<: *backend-base
    profiles: ["full"]
    image: streamora/engagement-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: engagement-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8090"
    expose: ["8090"]

  feed-service:
    <<: *backend-base
    profiles: ["full"]
    image: streamora/feed-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: feed-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8091"
    expose: ["8091"]

  search-service:
    <<: *backend-base
    profiles: ["full"]
    image: streamora/search-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: search-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8092"
    expose: ["8092"]

  pet-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/pet-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: pet-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8093"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamora?currentSchema=pet
      SPRING_DATASOURCE_USERNAME: streamora_pet
      SPRING_DATASOURCE_PASSWORD: ${STREAMORA_SERVICE_DB_PASSWORD:?请在 .env 中设置 STREAMORA_SERVICE_DB_PASSWORD}
      STREAMORA_IDENTITY_RPC_ENABLED: "true"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    expose: ["8093"]

  agent-service:
    <<: *backend-base
    profiles: *core-profiles
    image: streamora/agent-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: agent-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8094"
    expose: ["8094"]

  moderation-service:
    <<: *backend-base
    profiles: ["full"]
    image: streamora/moderation-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: moderation-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8095"
    expose: ["8095"]

  notification-service:
    <<: *backend-base
    profiles: ["full"]
    image: streamora/notification-service:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: platform/docker/backend.Dockerfile
      args: { SERVICE: notification-service }
    environment:
      <<: *backend-environment
      SERVER_PORT: "8096"
    expose: ["8096"]

  web:
    profiles: *core-profiles
    image: streamora/web:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - streamora-app

  admin-web:
    profiles: *core-profiles
    image: streamora/admin-web:${STREAMORA_IMAGE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-3001}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - streamora-app

networks:
  streamora-app:
    name: ${STREAMORA_COMPOSE_PROJECT:-streamora}-app
  streamora-data:
    name: ${STREAMORA_COMPOSE_PROJECT:-streamora}-data
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
