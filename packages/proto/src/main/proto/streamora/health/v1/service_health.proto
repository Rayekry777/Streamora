syntax = "proto3";

package streamora.health.v1;

option java_multiple_files = true;
option java_package = "com.streamora.contract.health.v1";
option java_outer_classname = "ServiceHealthContracts";

import "streamora/common/v1/common.proto";

message ServiceHealthRequest {
  streamora.common.v1.RequestContext context = 1;
}

message ServiceHealthResponse {
  string service_name = 1;
  string status = 2;
  string version = 3;
}

service ServiceHealthQuery {
  rpc GetHealth(ServiceHealthRequest) returns (ServiceHealthResponse);
}

