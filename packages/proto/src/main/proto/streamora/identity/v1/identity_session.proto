syntax = "proto3";

package streamora.identity.v1;

option java_multiple_files = true;
option java_package = "com.streamora.contract.identity.v1";
option java_outer_classname = "IdentitySessionProto";

service IdentitySessionService {
  rpc AuthenticateAdmin(AdminLoginCommand) returns (SessionAuthenticationResult);
  rpc ResolveAdminSession(SessionTokenQuery) returns (SessionPrincipalResult);
  rpc ResolveUserSession(SessionTokenQuery) returns (SessionPrincipalResult);
  rpc RevokeAdminSession(RevokeSessionCommand) returns (SessionMutationResult);
}

message AdminLoginCommand {
  string login = 1;
  string password = 2;
  string user_agent = 3;
  string ip_address = 4;
  string trace_id = 5;
}

message SessionTokenQuery {
  string raw_token = 1;
  string expected_audience = 2;
  string trace_id = 3;
}

message RevokeSessionCommand {
  string raw_token = 1;
  string expected_audience = 2;
  string trace_id = 3;
}

message SessionAuthenticationResult {
  bool authenticated = 1;
  string error_code = 2;
  string raw_token = 3;
  string subject_id = 4;
  string display_name = 5;
  string expires_at = 6;
}

message SessionPrincipalResult {
  bool authenticated = 1;
  string error_code = 2;
  string subject_id = 3;
  string display_name = 4;
  string audience = 5;
  string expires_at = 6;
}

message SessionMutationResult {
  bool completed = 1;
  string error_code = 2;
}
