name: Loop Auto Merge

on:
  workflow_run:
    workflows: [验证]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: loop-auto-merge-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'deploy-repair/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 对最新绿色 PR 启用 squash 自动合并
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          pr_json="$(gh pr view "$pr_number" --json headRefOid,isDraft,mergeStateStatus)"
          current_sha="$(jq -r .headRefOid <<< "$pr_json")"
          is_draft="$(jq -r .isDraft <<< "$pr_json")"
          merge_state="$(jq -r .mergeStateStatus <<< "$pr_json")"
          [[ "$current_sha" == "$VERIFIED_SHA" ]]
          [[ "$is_draft" == "false" ]]
          [[ "$merge_state" == "CLEAN" || "$merge_state" == "HAS_HOOKS" ]]
          checks="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${current_sha}/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | [.name, .status, .conclusion] | @tsv')"
          for required_check in 'Loop 治理' '前端与 OpenAPI' '后端 Maven 测试'; do
            if ! awk -F '\t' -v required="$required_check" \
              '$1 == required && $2 == "completed" && $3 == "success" { found = 1 } END { exit !found }' \
              <<< "$checks"; then
              echo "当前提交缺少成功的必需检查：${required_check}" >&2
              exit 1
            fi
          done
          gh pr comment "$pr_number" --body "<!-- streamora-loop
          verified_sha: ${VERIFIED_SHA}
          status: checks-passed-auto-merge-enabled
          -->"
          merge_body="$(printf '%s\\n' \
            '功能明细：' \
            '- 已通过最新 GitHub Actions 验证并自动 squash 合并' \
            '' \
            '验证结果：' \
            '- GitHub Actions 验证：通过' \
            '' \
            '未运行项：' \
            '- 部署后验证由部署工作流执行' \
            '' \
            '阶段状态：' \
            '- 阶段 3：待验收')"
          gh pr merge "$pr_number" --auto --squash --delete-branch \
            --subject "$(gh pr view "$pr_number" --json title --jq .title)" \
            --body "$merge_body"
          gh label create "agent:done" --color "0E8A16" --description "Loop Engineering 已完成" --force || true
          gh pr edit "$pr_number" --remove-label "agent:repairing" --remove-label "agent:root-cause" --add-label "agent:done" || true
