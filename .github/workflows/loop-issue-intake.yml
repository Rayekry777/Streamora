name: Loop Issue Intake

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: loop-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.label.name == 'agent:ready' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    outputs:
      branch: ${{ steps.commit.outputs.branch }}
      loop_id: ${{ steps.commit.outputs.loop_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: 校验标签操作者具有仓库写权限
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL_ACTOR: ${{ github.event.sender.login }}
        shell: bash
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${LABEL_ACTOR}/permission" --jq .permission)"
          case "$permission" in
            admin|maintain|write) echo 'authorized=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "agent:ready 标签操作者没有写权限：${LABEL_ACTOR}" >&2; exit 1 ;;
          esac

      - name: 校验自动化密钥已配置
        if: steps.authorize.outputs.authorized == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPAIR_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OPENAI_API_KEY" ]] && [[ -n "$REPAIR_TOKEN" ]]

      - name: 写入受控任务请求
        if: steps.authorize.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --jq '{number, title, body, html_url, author_association}' > loop-request.json
          jq -r '"# Issue #\(.number): \(.title)\n\n来源：\(.html_url)\n\n\(.body // \"\")"' loop-request.json > loop-request.md

      - name: 由 Codex 实现 Issue
        if: steps.authorize.outputs.authorized == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: >-
            Read .github/codex/prompts/issue-intake.md and loop-request.md.
            Implement only the approved Issue request. Do not commit or push.
          output-file: issue-implementation-report.md

      - name: 校验自动改动边界
        if: steps.authorize.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- .
          git diff --check
          changed_files="$(git diff --name-only -- . ':!loop-request.json' ':!loop-request.md' ':!issue-implementation-report.md')"
          test -n "$changed_files"
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              .env|.env.*|*/.env|*/.env.*|*application-secret*.yml|*application-secret*.yaml|*.pem|*.key|*.p12|*.pfx|*.jks|*.keystore|.github/workflows/*|pnpm-lock.yaml|package-lock.json|yarn.lock|npm-shrinkwrap.json)
                echo "Issue automation changed a prohibited file: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

      - name: 提交并推送 Issue 实现
        if: steps.authorize.outputs.authorized == 'true'
        id: commit
        env:
          REPAIR_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          loop_id="issue-${ISSUE_NUMBER}-${HEAD_SHA:0:12}"
          issue_slug="$(jq -r '.title' loop-request.json | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-36)"
          [[ -n "$issue_slug" ]] || issue_slug="task"
          branch="agent/${loop_id}-${issue_slug}"
          git switch -c "$branch"
          git config user.name "streamora-loop[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- loop-request.json loop-request.md issue-implementation-report.md || true
          git diff --cached --quiet && { echo "No implementation files to commit." >&2; exit 1; }
          git commit -F - <<EOF
          feat(交付): 实现 Issue #${ISSUE_NUMBER}

          功能明细：
          - 根据已授权的 Issue #${ISSUE_NUMBER} 生成最小可验证实现
          - 由 Loop Engineering 自动创建功能分支和拉取请求

          验证结果：
          - git diff --check：通过
          - 详细验证记录见对应 PR 与 Codex 报告 Artifact

          未运行项：
          - 完整前后端验证由 GitHub Actions 验证工作流执行

          阶段状态：
          - 阶段 3：待验收

          Streamora-Loop-Id: ${loop_id}
          Streamora-Loop-Root: ${HEAD_SHA}
          Streamora-Loop-Attempt: 0
          Streamora-Loop-Mode: feature
          EOF
          git remote set-url origin "https://x-access-token:${REPAIR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "loop_id=$loop_id" >> "$GITHUB_OUTPUT"

      - name: 创建功能 PR 并更新 Issue 状态
        if: steps.authorize.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          LOOP_ID: ${{ steps.commit.outputs.loop_id }}
          ROOT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create "agent:running" --color "1D76DB" --description "Loop Engineering 正在处理" --force || true
          gh label create "agent:done" --color "0E8A16" --description "Loop Engineering 已完成" --force || true
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          ## 变更目的

          自动实现已授权的 Issue #${ISSUE_NUMBER}。

          ## 功能明细

          - 由 Codex 根据 Issue 需求生成最小实现

          ## 接口、数据与迁移影响

          - 以实际代码变更和验证结果为准

          ## 验证结果

          - git diff --check：通过
          - GitHub Actions 验证：待执行

          ## 未运行项

          - 完整验证由 GitHub Actions 执行

          ## 风险与回滚

          - 风险：自动实现仅覆盖 Issue 明确范围。
          - 回滚方式：关闭 PR 或 revert squash 合并提交。

          ## Loop 证据

          <!-- streamora-loop
          loop_id: ${LOOP_ID}
          root_commit: ${ROOT_SHA}
          branch_decision: 从受保护的 master 创建 ${BRANCH}
          attempt: 0
          mode: feature
          source: Issue #${ISSUE_NUMBER}
          -->

          - Codex 报告会作为当前工作流 Artifact 上传。

          ## 阶段状态

          - 阶段 3：待验收
          EOF
          gh pr create --base master --head "$BRANCH" --title "feat(交付): 实现 Issue #${ISSUE_NUMBER}" --body-file "$body_file"
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:ready" --add-label "agent:running"

      - name: 上传 Issue 实现报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-issue-report-${{ github.event.issue.number }}
          path: issue-implementation-report.md
          if-no-files-found: warn
          retention-days: 14

  report-blocked:
    needs: implement
    if: needs.implement.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: 标记需要人工处理
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create "agent:blocked" --color "B60205" --description "Loop Engineering 已停止，等待人工处理" --force || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Loop Engineering 未能生成可验证的自动实现，未推送业务改动。请查看工作流诊断：${RUN_URL}"
