name: 部署 Core

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的 Git 引用或提交 SHA
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: stage-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, streamora-core]
    timeout-minutes: 75
    steps:
      - name: 检出已验证提交
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 确认部署提交
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"

      - name: 准备浏览器联调依赖
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并部署 Core
        id: deploy
        shell: bash
        run: scripts/ci/deploy-core.sh "${{ steps.revision.outputs.sha }}" scripts/ci/run-deployed-e2e.sh

      - name: 上传浏览器联调报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-e2e-report
          path: |
            playwright-report/deployed
            test-results/deployed
          if-no-files-found: warn
          retention-days: 14

      - name: 收集失败诊断
        if: failure()
        shell: bash
        run: scripts/ci/collect-deploy-diagnostics.sh "${{ steps.revision.outputs.sha }}" platform/deploy-diagnostics

      - name: 上传部署诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics
          path: platform/deploy-diagnostics
          if-no-files-found: warn
          retention-days: 14
