name: Loop PR Repair

on:
  workflow_run:
    workflows: [验证]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: loop-pr-repair-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.state.outputs.pr_number }}
      branch: ${{ steps.state.outputs.branch }}
      root_sha: ${{ steps.state.outputs.root_sha }}
      head_sha: ${{ steps.state.outputs.head_sha }}
      attempt: ${{ steps.state.outputs.attempt }}
      mode: ${{ steps.state.outputs.mode }}
      blocked: ${{ steps.state.outputs.blocked }}
      deepseek_key_configured: ${{ steps.credentials.outputs.deepseek_key_configured }}
      openai_key_configured: ${{ steps.credentials.outputs.openai_key_configured }}
      repair_token_configured: ${{ steps.credentials.outputs.repair_token_configured }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 读取 PR 与循环状态
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number')"
          test -n "$pr_number"
          base_sha="$(git merge-base origin/master HEAD)"
          root_sha="$(git show -s --format='%(trailers:key=Streamora-Loop-Root,valueonly)' "$HEAD_SHA" | head -n 1 | tr -d '[:space:]')"
          if [[ ! "$root_sha" =~ ^[0-9a-f]{40}$ ]]; then
            root_sha="$(git rev-list --reverse "${base_sha}..${HEAD_SHA}" | head -n 1)"
          fi
          if [[ ! "$root_sha" =~ ^[0-9a-f]{40}$ ]]; then
            root_sha="$HEAD_SHA"
          fi
          previous_attempts=0
          while IFS= read -r commit; do
            message="$(git show -s --format=%B "$commit")"
            if grep -Fqx "Streamora-Loop-Root: ${root_sha}" <<< "$message" &&
              grep -Eq '^Streamora-Loop-Mode: (ci-repair|root-cause)$' <<< "$message"; then
              previous_attempts=$((previous_attempts + 1))
            fi
          done < <(git rev-list "${base_sha}..${HEAD_SHA}")
          attempt=$((previous_attempts + 1))
          mode="ci-repair"
          blocked=false
          if (( attempt == 4 )); then
            mode="root-cause"
          elif (( attempt > 4 )); then
            mode="blocked"
            blocked=true
          fi
          {
            echo "pr_number=$pr_number"
            echo "branch=$BRANCH"
            echo "root_sha=$root_sha"
            echo "head_sha=$HEAD_SHA"
            echo "attempt=$attempt"
            echo "mode=$mode"
            echo "blocked=$blocked"
          } >> "$GITHUB_OUTPUT"

      - name: 检查自动修复凭据
        id: credentials
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEPLOY_REPAIR_GITHUB_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$DEEPSEEK_API_KEY" ]] && echo "deepseek_key_configured=true" >> "$GITHUB_OUTPUT" || echo "deepseek_key_configured=false" >> "$GITHUB_OUTPUT"
          [[ -n "$OPENAI_API_KEY" ]] && echo "openai_key_configured=true" >> "$GITHUB_OUTPUT" || echo "openai_key_configured=false" >> "$GITHUB_OUTPUT"
          [[ -n "$DEPLOY_REPAIR_GITHUB_TOKEN" ]] && echo "repair_token_configured=true" >> "$GITHUB_OUTPUT" || echo "repair_token_configured=false" >> "$GITHUB_OUTPUT"

      - name: 下载前端诊断
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: verify-frontend-diagnostics
          path: loop-diagnostics/frontend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 下载后端诊断
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: verify-backend-diagnostics
          path: loop-diagnostics/backend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 上传修复输入
        uses: actions/upload-artifact@v4
        with:
          name: loop-pr-repair-input-${{ github.event.workflow_run.id }}
          path: loop-diagnostics
          if-no-files-found: warn
          retention-days: 14

  minimal-repair:
    needs: prepare
    if: >-
      needs.prepare.outputs.blocked == 'false' &&
      needs.prepare.outputs.mode == 'ci-repair' &&
      needs.prepare.outputs.deepseek_key_configured == 'true' &&
      needs.prepare.outputs.repair_token_configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: 拒绝处理已过期的失败结果
        env:
          FAILED_SHA: ${{ needs.prepare.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$FAILED_SHA" ]]

      - uses: actions/download-artifact@v5
        with:
          name: loop-pr-repair-input-${{ github.event.workflow_run.id }}
          path: loop-diagnostics

      - name: 由 DeepSeek 执行最小修复
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_REPAIR_MODEL: ${{ vars.DEEPSEEK_REPAIR_MODEL || 'deepseek-chat' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/deepseek-patch-agent.mjs \
            --instruction .github/codex/prompts/pr-repair.md \
            --diagnostics loop-diagnostics \
            --mode pr-minimal \
            --patch loop-minimal-repair.patch \
            --report loop-minimal-repair-report.md
          git apply --check loop-minimal-repair.patch
          git apply loop-minimal-repair.patch

      - name: 校验最小修复边界
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          scripts/ci/validate-repair-patch.sh
          changed_files="$(git diff --name-only -- . ':!loop-diagnostics' ':!loop-minimal-repair.patch' ':!loop-minimal-repair-report.md')"
          test -n "$changed_files"
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              .env|.env.*|*/.env|*/.env.*|*application-secret*.yml|*application-secret*.yaml|*.pem|*.key|*.p12|*.pfx|*.jks|*.keystore|.github/*|*/db/migration/*|pnpm-lock.yaml|package-lock.json|yarn.lock|npm-shrinkwrap.json)
                echo "PR repair changed a prohibited file: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

      - name: 提交并推送最小修复
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          ROOT_SHA: ${{ needs.prepare.outputs.root_sha }}
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "streamora-loop-repair[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- loop-diagnostics loop-minimal-repair.patch loop-minimal-repair-report.md || true
          git diff --cached --quiet && { echo "DeepSeek produced no eligible repair." >&2; exit 1; }
          git commit -F - <<EOF
          fix(治理): PR #${PR_NUMBER} 第 ${ATTEMPT} 轮最小修复

          功能明细：
          - 根据最新 GitHub Actions 诊断修复当前 PR 的直接失败根因
          - 修复提交保留在原 PR 分支，供下一轮验证使用

          验证结果：
          - git diff --check：通过
          - 精确失败检查由 DeepSeek 按修复报告执行

          未运行项：
          - 完整前后端验证由本次推送触发的 GitHub Actions 执行

          阶段状态：
          - 阶段 3：待验收

          Streamora-Loop-Id: pr-${PR_NUMBER}-${ROOT_SHA:0:12}
          Streamora-Loop-Root: ${ROOT_SHA}
          Streamora-Loop-Attempt: ${ATTEMPT}
          Streamora-Loop-Mode: ci-repair
          EOF
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
          gh label create "agent:repairing" --color "FBCA04" --description "Loop Engineering 正在自动修复" --force || true
          gh pr edit "$PR_NUMBER" --add-label "agent:repairing" || true
          gh pr comment "$PR_NUMBER" --body "<!-- streamora-loop
          root_commit: ${ROOT_SHA}
          attempt: ${ATTEMPT}
          mode: ci-repair
          status: pushed-for-verification
          -->" || true

      - name: 上传最小修复报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-pr-minimal-repair-${{ needs.prepare.outputs.pr_number }}-${{ needs.prepare.outputs.attempt }}
          path: |
            loop-minimal-repair.patch
            loop-minimal-repair-report.md
          if-no-files-found: warn
          retention-days: 14

  root-cause-repair:
    needs: prepare
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.blocked == 'false' &&
      needs.prepare.outputs.mode == 'root-cause' &&
      needs.prepare.outputs.openai_key_configured == 'true' &&
      needs.prepare.outputs.repair_token_configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: 拒绝处理已过期的失败结果
        env:
          FAILED_SHA: ${{ needs.prepare.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$FAILED_SHA" ]]

      - uses: actions/download-artifact@v5
        with:
          name: loop-pr-repair-input-${{ github.event.workflow_run.id }}
          path: loop-diagnostics

      - name: 由 Codex 根因 Agent 执行第四轮修复
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: >-
            Read .github/codex/prompts/pr-root-cause-repair.md and loop-diagnostics/.
            This is root-cause attempt 4 for PR #${{ needs.prepare.outputs.pr_number }}.
            Root commit: ${{ needs.prepare.outputs.root_sha }}. Make only the smallest
            permitted repair. Do not commit, push, access secrets, or change prohibited files.
          output-file: loop-root-cause-report.md

      - name: 校验根因修复边界
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- .
          git diff --check
          scripts/ci/validate-repair-patch.sh
          changed_files="$(git diff --name-only -- . ':!loop-diagnostics' ':!loop-root-cause-report.md')"
          test -n "$changed_files"
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              .env|.env.*|*/.env|*/.env.*|*application-secret*.yml|*application-secret*.yaml|*.pem|*.key|*.p12|*.pfx|*.jks|*.keystore|.github/*|*/db/migration/*|pnpm-lock.yaml|package-lock.json|yarn.lock|npm-shrinkwrap.json)
                echo "Root-cause repair changed a prohibited file: $file" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

      - name: 提交并推送根因修复
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          ROOT_SHA: ${{ needs.prepare.outputs.root_sha }}
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "streamora-loop-root-cause[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- loop-diagnostics loop-root-cause-report.md || true
          git diff --cached --quiet && { echo "Codex produced no eligible root-cause repair." >&2; exit 1; }
          git commit -F - <<EOF
          fix(治理): PR #${PR_NUMBER} 根因修复

          功能明细：
          - 独立根因 Agent 在最小修复循环无法继续后重新定位并修复失败原因
          - 根因修复提交保留在原 PR 分支并重新触发完整验证

          验证结果：
          - git diff --check：通过
          - 精确失败检查和相关回归由 Codex 按根因报告执行

          未运行项：
          - 完整前后端验证由本次推送触发的 GitHub Actions 执行

          阶段状态：
          - 阶段 3：待验收

          Streamora-Loop-Id: pr-${PR_NUMBER}-${ROOT_SHA:0:12}
          Streamora-Loop-Root: ${ROOT_SHA}
          Streamora-Loop-Attempt: ${ATTEMPT}
          Streamora-Loop-Mode: root-cause
          EOF
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
          gh label create "agent:root-cause" --color "D93F0B" --description "Loop Engineering 正在根因修复" --force || true
          gh pr edit "$PR_NUMBER" --add-label "agent:root-cause" || true
          gh pr comment "$PR_NUMBER" --body "<!-- streamora-loop
          root_commit: ${ROOT_SHA}
          attempt: 4
          mode: root-cause
          status: pushed-for-verification
          -->" || true

      - name: 上传根因修复报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-pr-root-cause-${{ needs.prepare.outputs.pr_number }}
          path: |
            loop-root-cause.patch
            loop-root-cause-report.md
          if-no-files-found: warn
          retention-days: 14

  report-blocked:
    needs: prepare
    if: needs.prepare.outputs.blocked == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: 创建去重的阻塞 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          ROOT_SHA: ${{ needs.prepare.outputs.root_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          title="Loop 自动修复已停止: PR #${PR_NUMBER} ${ROOT_SHA:0:12}"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          gh label create "agent:blocked" --color "B60205" --description "Loop Engineering 已停止，等待人工处理" --force || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          if [[ -n "$existing" ]]; then
            exit 0
          fi
          gh issue create --title "$title" --label "agent:blocked" --body "PR #${PR_NUMBER} 的三轮最小修复与第四轮根因修复均未通过。自动写入已停止。失败验证：${RUN_URL}；根提交：${ROOT_SHA}。"

  report-missing-credentials:
    needs: prepare
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.blocked == 'false' &&
      ((needs.prepare.outputs.mode == 'ci-repair' && needs.prepare.outputs.deepseek_key_configured != 'true') ||
       (needs.prepare.outputs.mode == 'root-cause' && needs.prepare.outputs.openai_key_configured != 'true') ||
       needs.prepare.outputs.repair_token_configured != 'true')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: 创建缺失凭据诊断 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          ROOT_SHA: ${{ needs.prepare.outputs.root_sha }}
          MODE: ${{ needs.prepare.outputs.mode }}
          DEEPSEEK_READY: ${{ needs.prepare.outputs.deepseek_key_configured }}
          OPENAI_READY: ${{ needs.prepare.outputs.openai_key_configured }}
          TOKEN_READY: ${{ needs.prepare.outputs.repair_token_configured }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [[ "$MODE" == "ci-repair" && "$DEEPSEEK_READY" != "true" ]]; then missing+=("DEEPSEEK_API_KEY（前三轮最小补丁）"); fi
          if [[ "$MODE" == "root-cause" && "$OPENAI_READY" != "true" ]]; then missing+=("OPENAI_API_KEY（第四轮 Codex 根因修复）"); fi
          if [[ "$TOKEN_READY" != "true" ]]; then missing+=("DEPLOY_REPAIR_GITHUB_TOKEN（推送修复提交）"); fi
          title="Loop 自动修复未启用: PR #${PR_NUMBER} ${ROOT_SHA:0:12}"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          [[ -n "$existing" ]] && exit 0
          gh issue create --title "$title" --body "当前轮次缺少 GitHub Actions secret：${missing[*]}。请在 Settings -> Secrets and variables -> Actions 添加后，重新运行失败验证。验证：${RUN_URL}。"

  report-agent-failure:
    needs: [prepare, minimal-repair, root-cause-repair]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.blocked == 'false' &&
      (needs.minimal-repair.result == 'failure' || needs.root-cause-repair.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: 创建去重的 Agent 阻塞 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          ROOT_SHA: ${{ needs.prepare.outputs.root_sha }}
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Loop 修复 Agent 已停止: PR #${PR_NUMBER} ${ROOT_SHA:0:12}"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          gh label create "agent:blocked" --color "B60205" --description "Loop Engineering 已停止，等待人工处理" --force || true
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          if [[ -n "$existing" ]]; then
            exit 0
          fi
          gh issue create --title "$title" --label "agent:blocked" --body "PR #${PR_NUMBER} 的第 ${ATTEMPT} 轮自动修复未能产生安全、可验证且可提交的变更。工作流没有推送该轮业务改动。诊断：${RUN_URL}；根提交：${ROOT_SHA}。"
