name: 验证

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 改动分类
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      backend: ${{ steps.classify.outputs.backend }}
      runtime: ${{ steps.classify.outputs.runtime }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      backend_modules: ${{ steps.classify.outputs.backend_modules }}
      runtime_services: ${{ steps.classify.outputs.runtime_services }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: 计算受影响范围
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
            base_sha="$(git merge-base "origin/$BASE_REF" HEAD)"
            git diff --name-only "$base_sha" HEAD > changed-files.txt
            node scripts/ci/classify-changes.mjs --file-list changed-files.txt --github-output "$GITHUB_OUTPUT"
          else
            node scripts/ci/classify-changes.mjs --all --github-output "$GITHUB_OUTPUT"
          fi

  frontend:
    name: 前端与 OpenAPI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 校验 OpenAPI 与生成类型
        run: scripts/ci/verify-openapi.sh
      - name: 类型检查、Lint、测试与构建
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - name: 收集前端诊断
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/frontend
          printf 'workflow=%s\njob=%s\nsha=%s\n' "$GITHUB_WORKFLOW" "$GITHUB_JOB" "$GITHUB_SHA" > diagnostics/frontend/context.txt
          for path in test-results playwright-report packages/web/test-results packages/admin-web/test-results; do
            if [[ -e "$path" ]]; then cp -R "$path" diagnostics/frontend/"$(basename "$path")"; fi
          done
      - name: 上传前端诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-frontend-diagnostics
          path: diagnostics/frontend
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: 后端 Maven 测试
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven 受影响范围测试
        shell: bash
        env:
          BACKEND_MODULES: ${{ needs.changes.outputs.backend_modules }}
        run: |
          set -euo pipefail
          if [[ -n "$BACKEND_MODULES" ]]; then
            bash ./mvnw -B -ntp -pl "$BACKEND_MODULES" -am verify
          else
            bash ./mvnw -B -ntp verify
          fi
      - name: 收集后端诊断
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/backend
          printf 'workflow=%s\njob=%s\nsha=%s\n' "$GITHUB_WORKFLOW" "$GITHUB_JOB" "$GITHUB_SHA" > diagnostics/backend/context.txt
          find . -type f \( -path '*/target/surefire-reports/*' -o -path '*/target/failsafe-reports/*' \) -print0 | while IFS= read -r -d '' file; do
            destination="diagnostics/backend/${file#./}"
            mkdir -p "$(dirname "$destination")"
            cp "$file" "$destination"
          done
      - name: 上传后端诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-backend-diagnostics
          path: diagnostics/backend
          if-no-files-found: warn
          retention-days: 14

  functional-docker:
    name: 功能 Docker 验证
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: 校验受影响镜像与基础设施容器
        shell: bash
        run: bash scripts/ci/run-functional-docker-tests.sh "${{ needs.changes.outputs.runtime_services }}"
      - name: 收集 Docker 诊断
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics/docker
          docker ps -a > diagnostics/docker/containers.txt
          docker images > diagnostics/docker/images.txt
      - name: 上传 Docker 诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-docker-diagnostics
          path: diagnostics/docker
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: 文档链接
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: 校验本地文档链接
        run: node scripts/ci/check-doc-links.mjs

  verification-gate:
    name: 功能验证门禁
    if: always()
    needs: [changes, frontend, backend, functional-docker, documentation]
    runs-on: ubuntu-24.04
    steps:
      - name: 汇总必需检查
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          DOCKER_RESULT: ${{ needs.functional-docker.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$CHANGES_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT" "$DOCKER_RESULT" "$DOCUMENTATION_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "A required functional verification job ended with $result." >&2
              exit 1
            fi
          done
          echo "All selected functional verification jobs passed or were intentionally skipped."
