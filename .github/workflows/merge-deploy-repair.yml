name: 合并部署修复

on:
  workflow_run:
    workflows: [验证]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'deploy-repair/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 通过验证后 squash 合并修复 PR
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPAIR_GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          pr_json="$(gh pr view "$pr_number" --json headRefOid,isDraft,mergeStateStatus)"
          current_sha="$(jq -r .headRefOid <<< "$pr_json")"
          is_draft="$(jq -r .isDraft <<< "$pr_json")"
          merge_state="$(jq -r .mergeStateStatus <<< "$pr_json")"
          [[ "$current_sha" == "$VERIFIED_SHA" ]]
          [[ "$is_draft" == "false" ]]
          [[ "$merge_state" == "CLEAN" || "$merge_state" == "HAS_HOOKS" ]]
          checks="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${current_sha}/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | [.name, .status, .conclusion] | @tsv')"
          for required_check in 'Loop 治理' '前端与 OpenAPI' '后端 Maven 测试'; do
            if ! awk -F '\t' -v required="$required_check" \
              '$1 == required && $2 == "completed" && $3 == "success" { found = 1 } END { exit !found }' \
              <<< "$checks"; then
              echo "当前部署修复提交缺少成功的必需检查：${required_check}" >&2
              exit 1
            fi
          done
          pr_body="$(gh pr view "$pr_number" --json body --jq .body)"
          root_sha="$(printf '%s\n' "$pr_body" | sed -nE 's/^Deploy-Repair-Root:[[:space:]]*([0-9a-f]{40})$/\1/p' | head -n 1)"
          attempt="$(printf '%s\n' "$pr_body" | sed -nE 's/^Deploy-Repair-Attempt:[[:space:]]*([0-9]+)$/\1/p' | head -n 1)"
          [[ "$root_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$attempt" =~ ^[1-4]$ ]]
          merge_body="$(printf '%s\n' \
            '功能明细：' \
            '- 已通过独立修复 PR 验证的最小部署修复' \
            '' \
            '验证结果：' \
            '- GitHub Actions 验证：通过' \
            '' \
            '未运行项：' \
            '- 部署后浏览器联调由后续部署工作流执行' \
            '' \
            '阶段状态：' \
            '- 阶段 3：待验收' \
            '' \
            "Deploy-Repair-Root: ${root_sha}" \
            "Deploy-Repair-Attempt: ${attempt}")"
          gh pr merge "$pr_number" --auto --squash --delete-branch \
            --subject "fix(部署): 自动修复第 ${attempt} 轮" \
            --body "$merge_body"
